# ElasticMQ configuration for DeepRacer virtual racing.
#
# Provides a local, SQS-compatible FIFO queue used by the virtual_event worker.
# The queue is predefined here so it exists as soon as the service starts; no
# runtime create-queue call is needed for local/remote DR_CLOUD modes.
#
# node-address determines the host/port used to build queue URLs. It is set to
# the in-stack service name 'elasticmq' so the robomaker container can reach the
# queue at http://elasticmq:9324. The host CLI (dr-addracer-virtual) connects
# through the published port on localhost:9324 and resolves the queue by name.

include classpath("application.conf")

node-address {
    protocol = http
    host = "elasticmq"
    port = 9324
    context-path = ""
}

rest-sqs {
    enabled = true
    bind-port = 9324
    bind-hostname = "0.0.0.0"
    sqs-limits = strict
}

rest-stats {
    enabled = true
    bind-port = 9325
    bind-hostname = "0.0.0.0"
}

queues {
    "deepracer-virtual.fifo" {
        fifo = true
        contentBasedDeduplication = false
    }
}
